<!DOCTYPE html>
<html>
<head>
  <title>Form Validation Lab</title>
  <style>
    .error { color: red; }
    .success-box {
      margin-top: 20px;
      padding: 20px;
      background-color: #f0fff0;
      border: 1px solid #c0e0c0;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      width: fit-content;
    }
  </style>
</head>
<body>

  <h2>Registration Form</h2>

  <form id="myForm" onsubmit="return validateForm()">
    <div>
      <label for="name">Name:</label>
      <input type="text" id="name">
      <span id="nameError" class="error"></span>
    </div>
    <div>
      <label for="email">Email:</label>
      <input type="text" id="email">
      <span id="emailError" class="error"></span>
    </div>
    <div>
      <label for="age">Age:</label>
      <input type="text" id="age">
      <span id="ageError" class="error"></span>
    </div>
    <div>
      <label for="password">Password:</label>
      <input type="password" id="password">
      <span id="passwordError" class="error"></span>
    </div>
    <input type="submit" value="Submit">
  </form>

  <div id="successMessage" class="success-box" style="display:none;">
    <strong>This page says</strong>
    <p>Form submitted successfully!</p>
    <button onclick="document.getElementById('successMessage').style.display='none';">OK</button>
  </div>

  <script>
    function validateForm() {
      var name = document.getElementById("name").value.trim();
      var email = document.getElementById("email").value.trim();
      var age = document.getElementById("age").value.trim();
      var password = document.getElementById("password").value.trim();

      var nameError = document.getElementById("nameError");
      var emailError = document.getElementById("emailError");
      var ageError = document.getElementById("ageError");
      var passwordError = document.getElementById("passwordError");

      nameError.innerHTML = "";
      emailError.innerHTML = "";
      ageError.innerHTML = "";
      passwordError.innerHTML = "";
      document.getElementById("successMessage").style.display = "none";

      var valid = true;

      if (name === "") {
        nameError.innerHTML = "Name is required!";
        valid = false;
      }

      if (email === "" || !email.includes("@") || !email.includes(".")) {
        emailError.innerHTML = "Invalid email format!";
        valid = false;
      }

      var ageNumber = parseInt(age);
      if (isNaN(ageNumber) || ageNumber < 18 || ageNumber > 99) {
        ageError.innerHTML = "Age must be between 18 and 99!";
        valid = false;
      }

      if (password.length < 6) {
        passwordError.innerHTML = "Password must be at least 6 characters!";
        valid = false;
      }

      if (valid) {
        document.getElementById("successMessage").style.display = "block";
      }

      return false; 
    }
  </script>
</body>
</html>
